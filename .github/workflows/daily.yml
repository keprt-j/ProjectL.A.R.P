name: Daily LARP Chronicle

on:
  schedule:
    # 14:00 UTC daily (~10:00 ET / 09:00 EST)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-larp-chronicle
  cancel-in-progress: false

jobs:
  roll-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run chronicle bot
        env:
          # Authored as keprt-j so commits count on your GitHub contribution graph.
          GIT_AUTHOR_NAME: keprt-j
          GIT_AUTHOR_EMAIL: 181767491+keprt-j@users.noreply.github.com
          GIT_COMMITTER_NAME: keprt-j
          GIT_COMMITTER_EMAIL: 181767491+keprt-j@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          python3 bot.py
